name: OnePlus Care Pro v0.4 RC

on:
  push:
    paths:
      - "OnePlusCarePro_v0.4_RC/**"
      - ".github/workflows/oneplus-care-v04.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneplus-care-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: OnePlusCarePro_v0.4_RC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generated strings are up to date
        run: |
          python3 -I tools/gen_strings.py .
          git diff --exit-code -- app/src/main/res/values/strings.xml app/src/main/res/values-ar/strings.xml

      - name: Core unit tests (JVM)
        run: ./gradlew --no-configuration-cache :core:test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: App unit tests (Robolectric)
        if: always()
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        if: always()
        run: ./gradlew :app:lintDebug

      - name: Release build (R8, unsigned unless signing secrets are configured)
        if: always()
        run: ./gradlew :app:assembleRelease

      - name: Summarize test and lint results
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET, collections
          for mod in ("core", "app"):
              t = f = e = s = 0
              for p in glob.glob(f"{mod}/build/test-results/**/TEST-*.xml", recursive=True):
                  r = ET.parse(p).getroot()
                  t += int(r.get("tests")); f += int(r.get("failures")); e += int(r.get("errors")); s += int(r.get("skipped"))
              print(f"- {mod} tests: {t} run, {f} failed, {e} errors, {s} skipped")
          for p in glob.glob("app/build/reports/lint-results-debug.xml"):
              c = collections.Counter((i.get("severity"), i.get("id")) for i in ET.parse(p).getroot().iter("issue"))
              print(f"- lint: {sum(v for (sev, _), v in c.items() if sev in ('Error', 'Fatal'))} errors, {sum(v for (sev, _), v in c.items() if sev == 'Warning')} warnings")
              for (sev, i), v in sorted(c.items()):
                  print(f"  - {sev} {i}: {v}")
          PY

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus-care-debug-apk
          path: OnePlusCarePro_v0.4_RC/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneplus-care-reports
          path: |
            OnePlusCarePro_v0.4_RC/core/build/reports/
            OnePlusCarePro_v0.4_RC/core/build/test-results/
            OnePlusCarePro_v0.4_RC/app/build/reports/
            OnePlusCarePro_v0.4_RC/app/build/test-results/
            OnePlusCarePro_v0.4_RC/app/build/outputs/mapping/
          if-no-files-found: warn
